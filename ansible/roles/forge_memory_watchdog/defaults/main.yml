---
# A container at its memory limit that never OOMs is thrashing: its cgroup's
# memory.pressure shows it (#126). The watchdog kills the container's biggest
# process when `full avg10` (percent of time every task waited for memory)
# holds at the threshold for this many seconds.
#
# 20 % sits well above what a busy but healthy container reaches (a build that
# swaps its page cache stays in single digits) and far below a thrashing one
# (50 % and more in the field). 15 s outlasts the 10 s window of avg10, so
# that the pressure of a process just killed has fallen before a second kill
# can be decided.
forge_memory_watchdog_threshold: 20
forge_memory_watchdog_seconds: 15
# How often it looks, in seconds: reading a few cgroup files is cheap.
forge_memory_watchdog_interval: 1
# Incus names a container's cgroup "lxc.payload.<project>_<container>": the
# containers of the agent-forge project.
forge_memory_watchdog_cgroup_prefix: lxc.payload.agent-forge_
# Of those, only the team containers: every one is named agent-<team>-… (or
# agent-pilot). forge-proxy, in the same project, carries every strict
# container's traffic: killing its squid would cut them all off.
forge_memory_watchdog_container_prefix: agent-
# Where the script goes, and the node that runs it (NodeSource's, installed by
# the forge_users role, which comes first in site.yml).
forge_memory_watchdog_dir: /usr/local/lib/agent-forge
forge_memory_watchdog_node: /usr/bin/node

# What the watchdog's `forge notify` runs: the current release of forge.
forge_memory_watchdog_forge: "{{ forge_users_install_root }}/current/cli/forge"

# The host stays, the containers vary. Containers whose limits add up to more
# than the RAM, or a build that fills one, must never take sshd, Incus or the
# forge user's session down with them: at 24 s to exchange SSH keys, the 3.7 GiB
# recipe host (#143) was out of reach, and had to be rebooted.
#
# MemoryMin is protection, not allocation: the kernel does not reclaim a
# protected slice's pages (memory.min) while it uses less than the value, and
# the unused part stays free for the containers. So the value is the working
# set to keep resident, not a share of the RAM.
#   system.slice: Incus's daemon (about 150 MiB with a few containers), sshd,
#                 journald, fail2ban, nftables, this watchdog, their libraries
#                 and files in the page cache.
#   user.slice:   the forge user's session, `forge` (a Node process), forge-api
#                 (another one) and the user's systemd.
# 384M + 256M is 640 MiB: a sixth of a 4 GiB VM, little on 8 GiB or more.
# systemd syntax: a number with K, M, G or T (1024-based).
forge_memory_watchdog_reserve_system: 384M
forge_memory_watchdog_reserve_user: 256M
# A low OOM score for the two daemons nothing works without: when the kernel
# does kill (out of memory on the whole host), they are the last picked.
# -900 and not -1000, which would exempt them entirely and let a leak in
# either one take the host down. sshd's sessions inherit the value, as sshd
# restores the one it started with: the forge user's own shells are rarely the
# problem, and they are small.
forge_memory_watchdog_oom_score_adjust: -900
forge_memory_watchdog_oom_services: [ssh.service, incus.service]
