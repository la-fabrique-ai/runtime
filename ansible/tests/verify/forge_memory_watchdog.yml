---
# A read-only query: the systemd module has no way to read these properties.
- name: Read the watchdog's unit  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl show forge-memory-watchdog --property=ActiveState,UnitFileState,User,MainPID
  register: verify_wd_unit
  changed_when: false

- name: Check the watchdog runs, at boot, as the forge user and not as root
  ansible.builtin.assert:
    that:
      - "'ActiveState=active' in verify_wd_unit.stdout"
      - "'UnitFileState=enabled' in verify_wd_unit.stdout"
      - "'User=' ~ forge_users[0].name in verify_wd_unit.stdout.split('\n')"

- name: Read who runs the watchdog's process
  ansible.builtin.command:
    cmd: "ps -o user= -p {{ verify_wd_unit.stdout | regex_search('MainPID=(\\d+)', '\\1') | first }}"
  register: verify_wd_ps
  changed_when: false

- name: Check the process belongs to the forge user
  ansible.builtin.assert:
    that:
      - verify_wd_ps.stdout | trim == forge_users[0].name

- name: Read the watchdog's capabilities and groups
  ansible.builtin.command:
    cmd: "grep -E '^(CapEff|CapAmb|Groups):' /proc/{{ verify_wd_unit.stdout | regex_search('MainPID=(\\d+)', '\\1') | first }}/status"
  register: verify_wd_status
  changed_when: false

- name: Read the group exempt from hidepid
  ansible.builtin.command:
    cmd: getent group {{ hardening_proc_group | default('forge-procview') }}
  register: verify_wd_group
  changed_when: false

# No CAP_SYS_PTRACE (nor any capability): /proc is seen through the group the
# mount exempts from hidepid.
- name: Check it holds no capability, and is in the group
  ansible.builtin.assert:
    that:
      - verify_wd_status.stdout is search('CapEff:\\s+0000000000000000')
      - verify_wd_status.stdout is search('CapAmb:\\s+0000000000000000')
      - verify_wd_status.stdout is search('Groups:.*\\b' ~ verify_wd_group.stdout.split(':')[2] ~ '\\b')

# The host keeps its memory: MemoryMin on the two slices, in the cgroup tree and
# not only in the unit files, and a low OOM score on sshd and Incus, in the
# running processes and in the units (the units are what a reboot applies).
- name: Read the slices' memory.min
  ansible.builtin.command:
    cmd: "cat /sys/fs/cgroup/{{ item }}/memory.min"
  loop: [system.slice, user.slice]
  register: verify_wd_min
  changed_when: false

- name: Check the slices are protected as configured
  ansible.builtin.assert:
    that:
      - verify_wd_min.results[0].stdout | int == (forge_memory_watchdog_reserve_system | default('384M') | human_to_bytes)
      - verify_wd_min.results[1].stdout | int == (forge_memory_watchdog_reserve_user | default('256M') | human_to_bytes)

# A read-only query: the systemd module has no way to read these properties.
- name: Read the daemons' OOM score and main process  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl show --property=OOMScoreAdjust,MainPID {{ item }}
  loop: "{{ forge_memory_watchdog_oom_services | default(['ssh.service', 'incus.service']) }}"
  register: verify_wd_oom
  changed_when: false

- name: Read the running daemons' OOM score
  ansible.builtin.command:
    cmd: "cat /proc/{{ item.stdout | regex_search('MainPID=(\\d+)', '\\1') | first }}/oom_score_adj"
  loop: "{{ verify_wd_oom.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: verify_wd_oom_live
  changed_when: false

# At most the asked value: sshd sets its own listener to -1000.
- name: Check the daemons are the last the kernel kills
  ansible.builtin.assert:
    that:
      - "'OOMScoreAdjust=' ~ forge_memory_watchdog_oom_score_adjust | default(-900) in item.stdout.split('\n')"
      - verify_wd_oom_live.results[ansible_loop.index0].stdout | int <= forge_memory_watchdog_oom_score_adjust | default(-900)
  loop: "{{ verify_wd_oom.results }}"
  loop_control:
    label: "{{ item.item }}"
    extended: true

- name: Read the watchdog's journal
  ansible.builtin.command:
    cmd: journalctl -u forge-memory-watchdog --no-pager -o cat
  register: verify_wd_journal
  changed_when: false

- name: Check it says what it watches, with the settings of the inventory
  ansible.builtin.assert:
    that:
      - verify_wd_says in verify_wd_journal.stdout
  vars:
    verify_wd_says: >-
      kills the biggest process when memory.pressure full avg10 stays at
      {{ forge_memory_watchdog_threshold | default(20) }} or above for
      {{ forge_memory_watchdog_seconds | default(15) }} s

# The saturation of #126, reproduced: a container whose memory.high is below
# what its process wants never OOMs, and stalls on memory instead. The
# watchdog must kill that process and the container must answer again.
#
# memory.high (Incus's limits.memory.enforce=soft) and not a hard limit just
# below the process's size: at memory.max the kernel kills either at once or
# thrashes by chance, depending on the byte, while memory.high throttles
# without ever killing, so the test does not depend on luck. Only on a throwaway
# machine, and never in an existing agent-forge project.
- name: Run the saturation test
  when: verify_saturation | default(false) | bool
  block:
    - name: Look for an agent-forge project
      ansible.builtin.command:
        cmd: runuser -u {{ forge_users[0].name }} -- incus project show agent-forge
        chdir: /
      register: verify_wd_project
      changed_when: false
      failed_when: false

    - name: Say the test is skipped, rather than touch an existing project
      ansible.builtin.debug:
        msg: >-
          The agent-forge project exists on this machine, which is not a fresh
          one: saturation test skipped.
      when: verify_wd_project.rc == 0

    - name: Reproduce the saturation, then check the watchdog's work
      when: verify_wd_project.rc != 0
      block:
        - name: Write the process that grows to a cap
          ansible.builtin.copy:
            dest: /tmp/verify-grow.py
            mode: "0644"
            content: |
              import time
              chunks = []
              # Up to 400 MiB, well above the 160 MiB of memory.high (enough
              # to stall the container), then it keeps what it has: a process
              # nobody kills (forge-proxy's) must not fill the machine.
              while len(chunks) < 100:
                  chunks.append(bytearray(b"\x01") * (4 * 1024 * 1024))
                  time.sleep(0.02)
              time.sleep(3600)

        # Two containers under the same pressure: a team member (agent-wdtest)
        # and, in the same project, forge-proxy, which the watchdog must not
        # watch (killing its squid would cut every strict container off).
        - name: Create the test project, its containers and their processes
          ansible.builtin.command:
            cmd: runuser -u {{ forge_users[0].name }} -- bash -s
            chdir: /
            stdin: |
              set -ex
              # incus reads its standard input, which here is this script; and no
              # call may wait for ever: one that blocks fails at once, and the
              # trace on stderr names it.
              INCUS="$(command -v incus)"
              incus() { timeout -k 5 60 "$INCUS" "$@" </dev/null; }
              incus project create agent-forge -c features.images=false
              # The forge user's ids, mapped to aiuser's 1001 as forge's profile
              # does: the container's aiuser is the forge user on the host.
              IDMAP="uid $(id -u) 1001"$'\n'"gid $(id -g) 1001"
              for c in agent-wdtest forge-proxy; do
                incus launch images:ubuntu/26.04 "$c" --project agent-forge -s default \
                  -c limits.memory=160MiB -c limits.memory.enforce=soft -c limits.memory.swap=false \
                  -c raw.idmap="$IDMAP"
                incus exec "$c" --project agent-forge -- cat /proc/1/comm --wait || true
                incus exec "$c" --project agent-forge -- useradd -u 1001 -m aiuser
                # In aiuser's home: /tmp is emptied when the container's systemd boots,
                # which may be after this push.
                incus file push --mode 0644 --uid 1001 --gid 1001 /tmp/verify-grow.py "$c"/home/aiuser/grow.py --project agent-forge
                incus exec "$c" --project agent-forge -- su -s /bin/sh aiuser -c 'nohup timeout 300 python3 /home/aiuser/grow.py >/dev/null 2>&1 &'
              done
          changed_when: true
          # No step of this block waits for ever: each has a limit, and a test
          # that blocks fails, naming the step, in well under 10 minutes.
          timeout: 150

        - name: Wait for the watchdog to kill it
          ansible.builtin.command:
            cmd: journalctl -u forge-memory-watchdog --no-pager -o cat --since "-10min"
          register: verify_wd_kill
          until: "'agent-wdtest: killed pid' in verify_wd_kill.stdout"
          retries: 40
          delay: 3
          changed_when: false

        - name: Check what the watchdog said
          ansible.builtin.assert:
            that:
              - verify_wd_kill.stdout is search(verify_wd_killed)
          vars:
            verify_wd_killed: >-
              agent-wdtest: killed pid \d+ \(python3 grow.py, \d+ MiB RSS\), the biggest of its
              processes: memory.pressure full avg10=[\d.]+ has been
              {{ forge_memory_watchdog_threshold | default(20) }} or above for \d+ s

        # The container answers again, and the process is gone: the kill, not
        # luck, freed it. Generous timeouts: a container just out of a stall is
        # slow for a few seconds.
        - name: Check the container answers, and the process is gone
          ansible.builtin.command:
            cmd: runuser -u {{ forge_users[0].name }} -- bash -s
            chdir: /
            stdin: |
              set -e
              timeout -k 5 60 incus exec agent-wdtest --project agent-forge -- true </dev/null
              ! timeout -k 5 60 incus exec agent-wdtest --project agent-forge -- pgrep -f grow.py </dev/null
          changed_when: false
          timeout: 150

        - name: Check nothing else was killed
          ansible.builtin.command:
            cmd: runuser -u {{ forge_users[0].name }} -- bash -s
            chdir: /
            stdin: |
              set -e
              test "$(timeout -k 5 60 incus exec agent-wdtest --project agent-forge -- cat /proc/1/comm </dev/null)" = systemd
          changed_when: false
          timeout: 80

        # forge-proxy has stalled for as long as the team member did, and the
        # threshold's duration has passed twice over: had it been watched, its
        # process would be dead. It is still there, and the journal never names it.
        - name: Give a watched container's time to be killed
          ansible.builtin.pause:
            seconds: "{{ (forge_memory_watchdog_seconds | default(15) | int) + 10 }}"

        # Seen from the host: a stalled container does not answer incus exec,
        # which is what an unwatched one does. Only forge-proxy's process is
        # left, the team member's was killed.
        - name: Check forge-proxy is not watched
          ansible.builtin.command:
            cmd: pgrep -fc "^python3 /home/aiuser/grow.py"
          register: verify_wd_left
          changed_when: false
          failed_when: verify_wd_left.stdout | int != 1

        - name: Read the watchdog's journal again
          ansible.builtin.command:
            cmd: journalctl -u forge-memory-watchdog --no-pager -o cat --since "-10min"
          register: verify_wd_after
          changed_when: false

        - name: Check the journal never names forge-proxy
          ansible.builtin.assert:
            that:
              - "'forge-proxy' not in verify_wd_after.stdout"
      always:
        - name: Remove the test container and project
          ansible.builtin.command:
            cmd: runuser -u {{ forge_users[0].name }} -- bash -s
            chdir: /
            stdin: |
              INCUS="$(command -v incus)"
              incus() { timeout -k 5 40 "$INCUS" "$@" </dev/null; }
              incus delete -f agent-wdtest --project agent-forge || true
              incus delete -f forge-proxy --project agent-forge || true
              incus project delete agent-forge
          changed_when: true
          failed_when: false
          timeout: 120
