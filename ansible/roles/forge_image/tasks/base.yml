---
# The instance's network may come up after systemd reports it ready: the first
# apt run retries.
- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
  register: forge_image_apt_cache
  retries: 10
  delay: 6
  until: forge_image_apt_cache is succeeded

- name: Install the base packages
  ansible.builtin.apt:
    name:
      - git
      - git-lfs
      - curl
      - wget
      - unzip
      - zip
      - python3
      - python3-pip
      - python3-debian  # needed by ansible.builtin.deb822_repository
      - ca-certificates
      - acl  # setfacl: the ticket base's default ACL (the orchestrator's user and aiuser share it)
      - jq  # for the agent's own scripts (container/pre-bash.sh no longer runs in containers)
    state: present
